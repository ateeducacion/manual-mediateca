name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern fonts-liberation

      - name: Build PDF into dist/
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: manual-mediateca-pdf
          path: dist/*.pdf
          if-no-files-found: error

  publish-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: manual-mediateca-pdf
          path: pdf-out

      - name: Commit PDF to dist/
        run: |
          git rm -q --ignore-unmatch dist/*.pdf
          cp pdf-out/*.pdf dist/
          git add dist/*.pdf
          if git diff --cached --quiet; then
            echo "PDF sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar PDF en dist/"
            git push
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manual-mediateca-pdf
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.pdf --repo "$REPO" --title "Manual Mediateca $TAG" --generate-notes
